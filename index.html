<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#FAF0F1;min-height:100vh;padding:1rem}
.wrap{max-width:680px;margin:0 auto;background:#fff;border-radius:16px;padding:2rem 1.5rem;box-shadow:0 2px 20px rgba(122,78,78,0.08)}
.progress-bar{height:4px;background:#F0EAE8;border-radius:2px;margin:1rem 0 1.5rem}
.progress-fill{height:4px;background:#D4A5A5;border-radius:2px;transition:width 0.4s}
.block-label{font-size:12px;color:#B08080;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:0.5rem}
.question{font-size:17px;color:#2D1F1F;font-weight:500;line-height:1.5;margin-bottom:1.25rem}
.options{display:flex;flex-direction:column;gap:10px}
.opt{padding:12px 16px;border:1px solid #E4BCBC;border-radius:12px;cursor:pointer;font-size:15px;color:#2D1F1F;background:#fff;text-align:left;transition:border-color 0.2s,background 0.2s}
.opt:hover{border-color:#D4A5A5;background:#FAF0F1}
.opt.selected{border-color:#7A4E4E;background:#FAF0F1;color:#7A4E4E}
.scale-wrap{display:flex;gap:8px;flex-wrap:wrap}
.scale-btn{width:44px;height:44px;border:1px solid #E4BCBC;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;color:#7A4E4E;background:#fff;transition:all 0.2s}
.scale-btn:hover{border-color:#D4A5A5}
.scale-btn.selected{border-color:#7A4E4E;background:#D4A5A5;color:#7A4E4E}
.scale-labels{display:flex;justify-content:space-between;font-size:12px;color:#B08080;margin-top:6px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem}
.btn-next{padding:12px 28px;background:#7A4E4E;color:#FAF0F1;border:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;transition:opacity 0.2s}
.btn-next:hover{opacity:0.85}
.btn-next:disabled{opacity:0.35;cursor:not-allowed}
.btn-back{padding:12px 20px;background:none;border:1px solid #E4BCBC;border-radius:12px;font-size:15px;color:#7A4E4E;cursor:pointer}
.btn-back:hover{border-color:#D4A5A5}
.btn-back:disabled{opacity:0.35;cursor:not-allowed}
.q-counter{font-size:13px;color:#B08080}
.result-section{margin-bottom:1.75rem}
.result-block-title{font-size:16px;font-weight:500;color:#7A4E4E;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.result-bar-wrap{height:8px;background:#F0EAE8;border-radius:4px;margin-bottom:10px}
.result-bar{height:8px;border-radius:4px}
.result-text{font-size:14px;color:#5C3D3D;line-height:1.75}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;margin-bottom:8px}
.badge-low{background:#EAF3DE;color:#3B6D11}
.badge-mid{background:#FAEEDA;color:#854F0B}
.badge-high{background:#FCEBEB;color:#A32D2D}
.cta-block{background:#FAF0F1;border:1px solid #E4BCBC;border-radius:16px;padding:1.5rem;text-align:center;margin-top:2rem}
.cta-title{font-size:18px;font-weight:500;color:#7A4E4E;margin-bottom:8px}
.cta-text{font-size:14px;color:#5C3D3D;margin-bottom:1.25rem;line-height:1.6}
.cta-btn{display:inline-block;padding:14px 32px;background:#7A4E4E;color:#FAF0F1;border-radius:12px;font-size:15px;font-weight:500;text-decoration:none;margin:6px}
.cta-btn-outline{display:inline-block;padding:14px 32px;border:1.5px solid #7A4E4E;color:#7A4E4E;border-radius:12px;font-size:15px;font-weight:500;text-decoration:none;margin:6px}
.email-input,.name-input{width:100%;padding:12px 16px;border:1px solid #E4BCBC;border-radius:12px;font-size:15px;color:#2D1F1F;background:#fff;margin-bottom:10px}
.divider{border:none;border-top:1px solid #F0EAE8;margin:1.5rem 0}
.spam-note{background:#FAF0F1;border:1px solid #E4BCBC;border-radius:10px;padding:10px 14px;font-size:13px;color:#7A4E4E;margin-top:12px;line-height:1.6;text-align:left}
.success-note{background:#EAF3DE;border:1px solid #C0DD97;border-radius:10px;padding:10px 14px;font-size:13px;color:#3B6D11;margin-top:10px;line-height:1.6;text-align:center}
.brand-header{text-align:center;margin-bottom:1.5rem}
.brand-name{font-size:13px;color:#B08080;letter-spacing:0.1em;text-transform:uppercase}
</style>

const BLOCKS=[{id:'medical',title:'Медична картина',color:'#D4A5A5',questions:[{id:'m1',text:'Чи є у тебе або чоловіка медичні діагнози, пов\'язані з репродуктивним здоров\'ям?',type:'choice',options:[{text:'Ні, аналізи і обстеження — все в нормі',score:0},{text:'У мене є діагноз (ендометріоз, СПКЯ, міома та ін.)',score:2},{text:'У чоловіка є проблеми зі спермограмою',score:1},{text:'Є діагнози з обох сторін',score:3}]},{id:'m2',text:'Як давно ти намагаєшся завагітніти без результату?',type:'choice',options:[{text:'До 1 року',score:0},{text:'1–2 роки',score:1},{text:'3–5 років',score:2},{text:'Більше 5 років',score:3}]},{id:'m3',text:'Чи болісні у тебе місячні?',type:'choice',options:[{text:'Ні, все спокійно',score:0},{text:'Легкий дискомфорт',score:1},{text:'Досить болісні, іноді вживаю знеболювальне',score:2},{text:'Дуже сильний біль, не можу нормально функціонувати',score:3}]},{id:'m4',text:'Чи були у тебе вагітності раніше (у тому числі завмерлі, аборти, викидні)?',type:'choice',options:[{text:'Ні, жодної',score:0},{text:'Так, аборт за власним бажанням',score:2},{text:'Так, викидень або завмерла вагітність',score:3},{text:'Так, вагітність завершилась добре',score:0}]}]},{id:'mother',title:'Стосунки з мамою',color:'#E4BCBC',questions:[{id:'mo1',text:'Як би ти описала стосунки з мамою?',type:'choice',options:[{text:'Теплі, довірливі, близькі',score:0},{text:'Нейтральні, без конфліктів але й без близькості',score:1},{text:'Складні, багато напруги або образ',score:2},{text:'Дуже болісні або майже відсутні',score:3}]},{id:'mo2',text:'Що мама транслювала про материнство, пологи, жіночу роль?',type:'choice',options:[{text:'Позитивно — це радість, любов, сила',score:0},{text:'Нейтрально — просто не говорили про це',score:1},{text:'Скоріше негативно — важко, боляче, треба терпіти',score:2},{text:'Дуже негативно або з жахом і болем',score:3}]},{id:'mo3',text:'Чи хотіла ти в дитинстві бути схожою на маму?',type:'scale',label_left:'Зовсім ні',label_right:'Так, дуже',reverse:true}]},{id:'father',title:'Стосунки з татом і чоловіком',color:'#C49A9A',questions:[{id:'f1',text:'Чи відчувала ти в дитинстві захист, підтримку і увагу від тата?',type:'scale',label_left:'Зовсім ні',label_right:'Так, повністю',reverse:true},{id:'f2',text:'Якими є твої стосунки з чоловіком зараз?',type:'choice',options:[{text:'Близькі, довірливі, я почуваюсь у безпеці',score:0},{text:'Є напруга навколо теми вагітності',score:1},{text:'Загалом складні — є проблеми в комунікації',score:2},{text:'Багато конфліктів або відчуження',score:3}]},{id:'f3',text:'Чи довіряєш ти чоловіку як партнеру, який зможе подбати про сім\'ю?',type:'scale',label_left:'Зовсім ні',label_right:'Повністю',reverse:true}]},{id:'sexuality',title:'Тіло і сексуальність',color:'#D4A5A5',questions:[{id:'s1',text:'Чи можеш ти розслабитись і отримати задоволення під час сексу?',type:'scale',label_left:'Ні, дуже складно',label_right:'Так, легко',reverse:true},{id:'s2',text:'Яким був твій перший сексуальний досвід?',type:'choice',options:[{text:'Свідомий, я була готова і хотіла цього',score:0},{text:'Скоріше «так склалось», без особливого бажання',score:1},{text:'Під тиском або через страх відмовити',score:2},{text:'Це було травматично або насильницьки',score:3}]},{id:'s3',text:'Як ти ставишся до свого тіла?',type:'choice',options:[{text:'Люблю і приймаю його',score:0},{text:'Скоріше нейтрально',score:1},{text:'Є невдоволення, критикую себе',score:2},{text:'Відчуваю сором або відразу до свого тіла',score:3}]}]},{id:'fears',title:'Страхи і втрати',color:'#E4BCBC',questions:[{id:'fe1',text:'Чи є у тебе страхи пов\'язані з вагітністю або материнством?',type:'choice',options:[{text:'Ні, я відчуваю спокій і готовність',score:0},{text:'Є легке хвилювання — це нормально',score:1},{text:'Є конкретні страхи: пологів, болю, втрати себе',score:2},{text:'Сильний страх, який важко контролювати',score:3}]},{id:'fe2',text:'Що ти відчуваєш коли думаєш про те що втратиш після народження дитини?',type:'choice',options:[{text:'Мене це не турбує — я готова',score:0},{text:'Є деякі думки але я з ними справляюсь',score:1},{text:'Боюсь втратити себе, свободу, роботу, стосунки',score:2},{text:'Не можу уявити як жити після народження дитини',score:3}]},{id:'fe3',text:'Чи були втрати дітей у твоїй родині — аборти, викидні, смерті немовлят у мами або бабусі?',type:'choice',options:[{text:'Ні, про такі випадки не знаю',score:0},{text:'Можливо були, але не знаю деталей',score:1},{text:'Так, я знаю про такі випадки',score:2},{text:'Так, і це досі відчувається в нашій родині',score:3}]}]},{id:'emotions',title:'Емоції і підтримка',color:'#C49A9A',questions:[{id:'e1',text:'Як ти справляєшся з негативними емоціями — злістю, образою, болем?',type:'choice',options:[{text:'Виражаю їх — плачу, говорю, дозволяю собі злитись',score:0},{text:'Іноді виражаю, але частіше тримаю в собі',score:1},{text:'Переважно стримую — не можна показувати слабкість',score:2},{text:'Взагалі не вмію проявляти емоції, все всередині',score:3}]},{id:'e2',text:'Чи є у тебе люди яким ти можеш довіритись і відчути підтримку?',type:'scale',label_left:'Зовсім ні, я сама',label_right:'Так, є підтримка',reverse:true},{id:'e3',text:'Чи вважаєш ти себе щасливою людиною зараз?',type:'scale',label_left:'Зовсім ні',label_right:'Так, загалом',reverse:true}]},{id:'beliefs',title:'Переконання і готовність',color:'#D4A5A5',questions:[{id:'b1',text:'Закінчи речення: "Діти — це..."',type:'choice',options:[{text:'Радість, любов, сенс',score:0},{text:'Відповідальність, але я готова',score:1},{text:'Важко, складно, обов\'язок',score:2},{text:'Щось що мене лякає або до чого я не готова',score:3}]},{id:'b2',text:'Закінчи речення: "Мама — це жінка яка..."',type:'choice',options:[{text:'Любить, підтримує, дає простір',score:0},{text:'Турбується і піклується',score:0},{text:'Жертвує собою заради дітей',score:2},{text:'Живе тільки для дітей і забуває про себе',score:3}]},{id:'b3',text:'Чи хочеш ти дитину для себе — бо відчуваєш справжнє бажання?',type:'choice',options:[{text:'Так, це моє щире бажання',score:0},{text:'Бажаю, але є й тиск від рідних або суспільства',score:1},{text:'Важко розрізнити — своє бажання чи очікування інших',score:2},{text:'Скоріше тиск ззовні — відчуваю що "вже пора"',score:3}]}]}];
const EXP={medical:{low:'Медична картина відносно спокійна — явних фізіологічних перешкод не виявлено. Але важливо розуміти: навіть коли "все в нормі", тіло може перебувати в стані прихованої готовності до захисту. Нервова система керує репродуктивною функцією через гіпоталамо-гіпофізарну вісь — і навіть помірний хронічний стрес здатен порушувати виділення ФСГ і ЛГ, гормонів які відповідають за дозрівання фолікула. Якщо психологічний стан нестабільний, тіло отримує сигнал: "зараз небезпечно, не час для дитини." Це не діагноз — це захисна реакція організму яку можна змінити.',mid:'Медичні показники викликають питання і це важливий сигнал. Ендометріоз, СПКЯ, порушення циклу — ці стани мають потужний психосоматичний компонент. Хронічний стрес підвищує рівень кортизолу, який пригнічує вироблення прогестерону — гормону необхідного для підтримки вагітності. При СПКЯ часто виявляють підвищений кортизол і порушення інсулінової чутливості — обидва стани пов\'язані з тривалим емоційним напруженням. Ендометріоз дослідники все частіше пов\'язують із пригніченою злістю і неможливістю встановлювати межі. Тіло буквально "виходить за межі" — ендометрій росте там де не повинен. Медичне лікування важливе, але без роботи з психологічним корінням воно дає тимчасовий результат.',high:'Серйозні медичні обставини потребують комплексного погляду. Тіло яке довго перебуває під психологічним тиском починає змінювати фізіологію — це не метафора, це нейроендокринологія. Кортизол блокує вісь гіпоталамус-гіпофіз-яєчники, порушуючи овуляцію. М\'язи малого тазу хронічно напружені через страх і тривогу — матка буквально стиснута, кровообіг порушений, слизова оболонка не отримує достатнього живлення для імплантації. Викидні та завмерлі вагітності часто є реакцією імунної системи яка активується при стресі — організм сприймає ембріон як загрозу. Робота з психосоматологом не замінює медицину але суттєво підвищує її ефективність.'},mother:{low:'Стосунки з мамою відносно ресурсні — базова модель жіночності та материнства не несе великого тягаря. Коли дівчинка бачила маму щасливою жінкою і матір\'ю, вона несвідомо записує: "бути мамою — це безпечно і добре." Ця програма підтримує готовність тіла до вагітності на глибокому рівні. Навіть у цьому блоці варто придивитись до дрібних переконань які могли бути засвоєні непомітно.',mid:'Стосунки з мамою мають свої складнощі — і це впливає на репродуктивну готовність більше ніж здається. Несвідомо кожна жінка несе в собі образ материнства від власної мами. Якщо цей образ пов\'язаний із болем, жертовністю або відчуженням — тіло може опиратись "ставати такою ж." Гіпоталамус не розрізняє минуле і теперішнє — якщо образ материнства несе загрозу, він гальмує репродуктивну вісь. Крім того, складні стосунки з мамою часто формують тривожний тип прив\'язаності який тримає нервову систему в стані постійної готовності до небезпеки. А вагітність вимагає протилежного — стану безпеки і розслаблення.',high:'Стосунки з мамою — одна з ключових зон роботи. Коли дівчинка не хотіла бути схожою на маму або бачила материнство як щось болісне і виснажливе — несвідомо формується програма "я не хочу цього для себе." Ця програма зберігається в лімбічній системі мозку і впливає на гормональну регуляцію. Матка — орган який реагує на емоційний стан через вегетативну нервову систему. При несвідомому страху "стати мамою" м\'язи матки і маткових труб перебувають у хронічному спазмі. Спазм маткових труб може фізично перешкоджати просуванню яйцеклітини. Негативні переконання про пологи підвищують рівень адреналіну — гормону який звужує судини і погіршує кровопостачання репродуктивних органів. Це не вирок — це програма яку можна переписати.'},father:{low:'Базовий досвід безпеки з чоловічою фігурою відносно ресурсний. Відчуття захисту і надійності від тата формує здатність довіряти чоловікам і розслаблятись поруч з ними. Це критично важливо для зачаття — тіло жінки відкривається до вагітності тільки в стані безпеки.',mid:'Є певні питання щодо довіри і відчуття захисту. Репродуктивна система жінки еволюційно налаштована на оцінку безпеки середовища. Якщо підсвідомо присутнє відчуття "на нього не можна покластись" — організм отримує сигнал тривоги. При тривозі активується симпатична нервова система — режим "бий або біжи." У цьому режимі кров перерозподіляється до м\'язів і серця, а репродуктивні органи отримують менше кровопостачання. Овуляція може придушуватись або зсуватись. Матка в стані напруження — не найкраще місце для імплантації.',high:'Відсутність безпеки і довіри — серйозний психосоматичний фактор. Якщо жінка не відчуває захисту від партнера або несе несвідомий тягар від болісних стосунків з татом — тіло буквально закривається. Хронічна тривога в стосунках підтримує постійно підвищений рівень кортизолу і адреналіну. Ці гормони пригнічують вироблення естрогену і прогестерону — основних гормонів репродуктивного циклу. Спазм м\'язів тазового дна і матки при хронічному стресі у стосунках — доведений фізіологічний факт. Крім того несвідомий страх "народити дитину від ненадійного чоловіка" може блокувати овуляцію на рівні гіпофіза. Тіло мудріше ніж ми думаємо — воно чекає справжньої безпеки.'},sexuality:{low:'Відносини з тілом і сексуальністю відносно гармонійні. Здатність розслаблятись і отримувати задоволення — це не лише про якість інтимного життя. Під час оргазму виділяється окситоцин який розслаблює матку і маткові труби, покращує їх перистальтику і допомагає сперматозоїдам рухатись до яйцеклітини. Це буквальна фізіологія. Жінка яка відчуває задоволення у сексі створює оптимальні умови для зачаття.',mid:'Є певна напруга в тілесній сфері яку варто дослідити. Неможливість повністю розслабитись під час сексу — це сигнал що нервова система перебуває в режимі контролю. Коли тіло не розслабляється, м\'язи піхви і матки залишаються в тонусі. Це впливає на рух сперматозоїдів і на можливість яйцеклітини вийти з фолікула. Сором або критика власного тіла підвищують рівень кортизолу навіть під час статевого акту — що безпосередньо знижує шанси на зачаття. Сексуальна і репродуктивна енергія живляться з одного джерела.',high:'Це серйозна зона роботи з прямим впливом на фізіологію зачаття. Травматичний сексуальний досвід залишає в нервовій системі стійкий патерн — тіло асоціює секс із небезпекою і напружується навіть коли свідомо жінка хоче розслабитись. У стані напруження піхва і матка не виробляють достатньо природного мастила і слизу — середовище стає несприятливим для сперматозоїдів. Сором і відраза до власного тіла формують хронічно підвищений кортизол який пригнічує вироблення ФСГ і естрогену необхідних для дозрівання яйцеклітини. Тіло яке отримало сигнал "бути жінкою небезпечно" захищає себе єдиним доступним способом — не дозволяє вагітності настати.'},fears:{low:'Страхи мінімальні і це ресурсний стан. Але варто пам\'ятати що деякі страхи живуть глибоко в несвідомому і не проявляються як явна тривога. Відчуття спокою — добрий знак, і водночас запрошення придивитись до більш тонких сигналів тіла.',mid:'Страхи присутні і вони впливають на фізіологію більше ніж здається. Страх пологів активує мигдалеподібне тіло мозку — центр тривоги. Це запускає каскад стресових гормонів: адреналін звужує судини матки, кортизол пригнічує прогестерон, норадреналін підвищує тонус м\'язів малого тазу. Страх втратити себе або своє життя після народження дитини — це несвідомий конфлікт між бажанням мати дитину і бажанням зберегти себе. Цей конфлікт буквально "паралізує" рішення тіла. Родові травми — аборти і викидні у мами або бабусі — передаються через несвідоме і формують програму "в нашому роду діти не виживають."',high:'Сильні страхи і родові травми — один із найпотужніших психосоматичних блоків. Хронічний страх тримає гіпоталамус у стані постійної тривоги. Гіпоталамус керує гіпофізом який регулює яєчники — це одна система. При постійній тривозі гіпофіз знижує виділення ЛГ — гормону який запускає овуляцію. Тіло буквально "вимикає" можливість завагітніти вважаючи це небезпечним. Родові втрати в сімейній системі — аборти, викидні, смерті — залишають несвідоме відчуття що вагітність закінчується болем. Тіло захищає жінку від цього болю єдиним способом який знає — не допускаючи вагітності. Це не слабкість — це лояльність до роду яку можна трансформувати.'},emotions:{low:'Емоційна сфера відносно відкрита — є ресурс і підтримка. Здатність виражати емоції безпосередньо впливає на гормональний баланс. Коли жінка плаче, злиться, сміється — її нервова система регулює себе природно. Це підтримує стабільний рівень кортизолу і нормальний репродуктивний цикл.',mid:'Є тенденція до стримування емоцій — і це має фізіологічні наслідки. Коли злість, образа або біль не виходять назовні — вони "осідають" у тілі у вигляді м\'язової напруги. М\'язи матки, маткових труб і тазового дна — це м\'язи які реагують на емоційне напруження так само як спина або шия. Хронічне стримування емоцій підтримує підвищений кортизол який конкурує з прогестероном за одні й ті самі рецептори. Чим більше кортизолу — тим менше прогестерону доходить до матки. А прогестерон — це гормон вагітності, без якого імплантація неможлива.',high:'Емоційна закритість — один із найсильніших і найбільш недооцінених факторів. Жінка яка роками тримає все в собі живе в стані хронічного стресу навіть якщо зовні виглядає спокійно. Хронічний стрес виснажує надниркові залози які виробляють і кортизол і ДГЕА — попередник статевих гормонів. Коли надниркові залози перевантажені — яєчники отримують менше сигналів і менше ресурсів для дозрівання фолікулів. Якість яйцеклітин знижується. Ізоляція і відсутність підтримки посилюють цей ефект — самотність підвищує запальні маркери в крові які несприятливо впливають на середовище матки. Тіло жінки зачинає дитину не на самоті — воно потребує відчуття племені і безпеки.'},beliefs:{low:'Переконання про материнство відносно позитивні і власне бажання усвідомлене. Це дуже важливо — коли жінка хоче дитину для себе, із власного наповнення, тіло отримує чіткий дозвіл. Переконання живуть не лише в голові — вони формують нейронні мережі які впливають на роботу ендокринної системи.',mid:'Є змішані переконання або зовнішній тиск — і тіло це відчуває. Коли бажання дитини частково нав\'язане ззовні, у психіці виникає несвідомий конфлікт: "хочу щоб від мене відстали" і "не хочу цього для себе." Цей конфлікт транслюється через нервову систему у вигляді непослідовних гормональних сигналів. Переконання "мама — це жертва" формує несвідомий опір материнству навіть коли свідомо жінка дуже хоче дитину. Тіло слухається глибшого шару — того що записано в дитинстві.',high:'Негативні переконання про материнство або відсутність справжнього власного бажання — це найглибший рівень блоку. Переконання формуються в дитинстві і записуються як нейронні програми в лімбічній системі. Ця система керує гормонами, імунітетом і вегетативною нервовою системою. Коли програма каже "бути мамою — це страшно, боляче, втратити себе" — гіпоталамус отримує команду не запускати репродуктивний цикл повноцінно. Переконання можуть буквально змінювати щільність оболонки яйцеклітини — тіло під дією стресових нейропептидів формує захисний шар навколо яйцеклітини який стає важко подолати сперматозоїду. Це не містика — це психонейроімунологія. Тіло виконує команду яку отримує від психіки. Змінити команду — значить змінити результат.'}};
let answers={},currentQ=0,allQuestions=[],emailValue='',nameValue='',showResults=false;
BLOCKS.forEach(b=>b.questions.forEach(q=>allQuestions.push({...q,blockId:b.id})));
const total=allQuestions.length;
function getScore(blockId){const bqs=allQuestions.filter(q=>q.blockId===blockId);let sum=0,max=0;bqs.forEach(q=>{const a=answers[q.id];if(q.type==='choice'){if(a!==undefined)sum+=q.options[a].score;max+=3;}else{const v=a!==undefined?a:0;sum+=q.reverse?(5-v):v;max+=4;}});return{sum,max,pct:Math.round(sum/max*100)};}
function getLevel(pct){return pct<=33?'low':pct<=66?'mid':'high';}
function getLevelLabel(pct){if(pct<=33)return['Мінімальний вплив','badge-low'];if(pct<=66)return['Помірний вплив','badge-mid'];return['Сильний вплив','badge-high'];}
function buildResultsText(){let txt='';BLOCKS.forEach(b=>{const s=getScore(b.id);const[label]=getLevelLabel(s.pct);txt+=`\n${b.title}: ${label} (${s.pct}%)\n`;});return txt;}
function sendEmails(name,email){const results=buildResultsText();const date=new Date().toLocaleDateString('uk-UA');const base={user_name:name||'Не вказано',user_email:email||'Не вказано',results,date};emailjs.send('service_de7a5k2','template_tghfqta',{...base,to_email:'svetlanabeloded4@gmail.com'});if(email){emailjs.send('service_de7a5k2','template_tghfqta',{...base,to_email:email});}}
function render(){const app=document.getElementById('app');if(!showResults){renderQuestion(app);}else{renderResults(app);}}
function renderIntro(app){app.innerHTML=`<div class="brand-header"><p class="brand-name">SVITMAMI · Психосоматика і вагітність</p></div><h1 style="font-size:22px;font-weight:500;color:#2D1F1F;margin-bottom:12px;line-height:1.4">Чи заважає психологія твоїй вагітності?</h1><p style="font-size:15px;color:#5C3D3D;line-height:1.7;margin-bottom:1.5rem">Цей тест діагностує психологічні і психосоматичні причини які можуть блокувати настання вагітності. Ти отримаєш детальний результат по 7 зонах з поясненням як кожна з них впливає на твоє тіло і репродуктивне здоров'я.</p><div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:1.5rem"><span style="font-size:13px;color:#B08080">📋 ${total} питань</span><span style="font-size:13px;color:#B08080">⏱ ~10 хвилин</span><span style="font-size:13px;color:#B08080">📊 7 блоків діагностики</span></div><button class="btn-next" onclick="startTest()" style="width:100%">Почати діагностику →</button><p style="font-size:13px;color:#B08080;margin-top:12px;text-align:center">Відповідай чесно — тест показує реальну картину</p>`;}
function renderQuestion(app){const q=allQuestions[currentQ];const block=BLOCKS.find(b=>b.id===q.blockId);const pct=Math.round((currentQ/total)*100);const hasAnswer=answers[q.id]!==undefined;let optionsHtml='';if(q.type==='choice'){optionsHtml=`<div class="options">`+q.options.map((o,i)=>`<button class="opt${answers[q.id]===i?' selected':''}" onclick="selectChoice('${q.id}',${i})">${o.text}</button>`).join('')+`</div>`;}else{const val=answers[q.id];optionsHtml=`<div class="scale-wrap">${[1,2,3,4,5].map(n=>`<button class="scale-btn${val===n?' selected':''}" onclick="selectScale('${q.id}',${n})">${n}</button>`).join('')}</div><div class="scale-labels"><span>${q.label_left}</span><span>${q.label_right}</span></div>`;}app.innerHTML=`<p class="block-label">${block.title}</p><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><p class="question">${q.text}</p>${optionsHtml}<div class="nav"><button class="btn-back" onclick="goBack()" ${currentQ===0?'disabled':''}>← Назад</button><span class="q-counter">${currentQ+1} / ${total}</span><button class="btn-next" onclick="goNext()" ${!hasAnswer?'disabled':''}>${currentQ===total-1?'Переглянути результат':'Далі →'}</button></div>`;}
function renderEmailStep(app){app.innerHTML=`<div style="text-align:center;padding:2rem 0"><p style="font-size:22px;font-weight:500;color:#2D1F1F;margin-bottom:12px">Майже готово!</p><p style="font-size:15px;color:#5C3D3D;margin-bottom:1.5rem;line-height:1.7">Залиш своє ім'я і email — я надішлю тобі детальний результат особисто.</p><input class="name-input" type="text" placeholder="Твоє ім'я" value="${nameValue}" oninput="nameValue=this.value" /><input class="email-input" type="email" placeholder="твій@email.com" value="${emailValue}" oninput="emailValue=this.value" /><button class="btn-next" style="width:100%;margin-bottom:10px" onclick="submitAndShow()">Отримати результат →</button><div class="spam-note">📩 Лист з результатами може потрапити в папку <strong>Спам</strong> або <strong>Промоакції</strong> — обов'язково перевір її якщо не бачиш у вхідних.</div><p style="font-size:13px;color:#B08080;margin-top:14px;cursor:pointer" onclick="showResultPage()">Переглянути без збереження</p></div>`;}
function submitAndShow(){sendEmails(nameValue,emailValue);showResultPage();}
function showResultPage(){showResults=true;render();}
function renderResults(app){let totalScore=0,totalMax=0;const blockResults=BLOCKS.map(b=>{const s=getScore(b.id);totalScore+=s.sum;totalMax+=s.max;return{...b,...s};});const overallPct=Math.round(totalScore/totalMax*100);let overallText,overallColor;if(overallPct<=25){overallText='Психологічні блоки мінімальні. Твій внутрішній стан відносно ресурсний. Варто також перевірити медичну сторону питання і розглянути тонкі психологічні фактори.';overallColor='#3B6D11';}else if(overallPct<=50){overallText='Є декілька зон де психологія впливає на твою репродуктивну готовність. Робота з психосоматологом допоможе прибрати ці блоки і дати тілу дозвіл.';overallColor='#854F0B';}else{overallText='Психологічні блоки присутні і вони серйозні. Твоє тіло здорове — але воно чекає внутрішнього дозволу. Саме з цим я працюю.';overallColor='#A32D2D';}const blocksHtml=blockResults.map(b=>{const[label,badgeClass]=getLevelLabel(b.pct);const level=getLevel(b.pct);return`<div class="result-section"><div class="result-block-title"><span style="width:10px;height:10px;border-radius:50%;background:${b.color};display:inline-block"></span>${b.title}</div><span class="badge ${badgeClass}">${label}</span><div class="result-bar-wrap"><div class="result-bar" style="width:${b.pct}%;background:${b.color}"></div></div><p class="result-text">${EXP[b.id][level]}</p><hr class="divider"></div>`;}).join('');app.innerHTML=`<p style="font-size:12px;color:#B08080;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px">SVITMAMI · Результат діагностики</p>${nameValue?`<p style="font-size:15px;color:#5C3D3D;margin-bottom:1rem">Результати для: <span style="color:#7A4E4E;font-weight:500">${nameValue}</span></p>`:''}<div style="background:#FAF0F1;border:1px solid #E4BCBC;border-radius:12px;padding:1.25rem;margin-bottom:1.5rem"><p style="font-size:13px;color:#7A4E4E;margin-bottom:6px">Загальний рівень психологічного впливу</p><div class="progress-bar" style="margin:8px 0"><div class="progress-fill" style="width:${overallPct}%;background:#7A4E4E"></div></div><p style="font-size:15px;color:${overallColor};line-height:1.6">${overallText}</p></div>${blocksHtml}<div class="cta-block"><p class="cta-title">Твій результат — це початок</p><p class="cta-text">Тест показує де саме тіло тримає напругу і чому вагітність не настає. На консультації ми знайдемо конкретну причину і почнемо її трансформувати. Твоє тіло готове — йому потрібен дозвіл.</p><a class="cta-btn" href="https://instagram.com/svitmami" target="_blank">Записатись на консультацію</a><a class="cta-btn-outline" href="https://instagram.com/direct/svitmami" target="_blank">Написати в директ</a></div>${emailValue?`<div class="success-note">✅ Результати надіслано на ${emailValue} — перевір папку Спам якщо не бачиш у вхідних</div>`:''}`;}
function selectChoice(qId,idx){answers[qId]=idx;render();}
function selectScale(qId,val){answers[qId]=val;render();}
function goNext(){if(currentQ<total-1){currentQ++;render();}else{const app=document.getElementById('app');renderEmailStep(app);}}
function goBack(){if(currentQ>0){currentQ--;render();}}
function startTest(){render();}
renderIntro(document.getElementById('app'));
</script>
</body>
</html>
